<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced List Formatter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for dark mode */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
    </style>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 flex items-center justify-center p-4">

    <div class="bg-gray-900 rounded-xl shadow-2xl border border-gray-800 w-full max-w-5xl p-6 md:p-8 flex flex-col min-h-[90vh] md:min-h-0 md:h-auto">
        
        <!-- Header Section -->
        <div class="mb-6 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">List Formatter <span class="text-blue-500">Pro</span></h1>
                <p class="text-gray-400 text-sm mt-1">Paste your text, build your rules, and format instantly.</p>
            </div>
        </div>

        <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-6 min-h-[300px]">
            
            <!-- Input Section -->
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-center mb-2 min-h-[32px]">
                    <label for="inputText" class="block text-sm font-medium text-gray-300">Input Text</label>
                    <button id="clearBtn" class="bg-gray-800 hover:bg-red-900/40 text-gray-300 hover:text-red-400 border border-gray-700 hover:border-red-800 text-xs font-medium py-1.5 px-3 rounded-md transition-all flex items-center gap-1.5 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        Clear Text
                    </button>
                </div>
                <textarea id="inputText" 
                    class="flex-grow w-full p-4 bg-gray-950 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none font-mono text-sm text-gray-200 placeholder-gray-600 shadow-inner" 
                    placeholder="Paste your text here...&#10;Example: 3.14, 2.68, 2.90"
                ></textarea>
            </div>

            <!-- Output Section (Layout Fixed) -->
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-center mb-2 min-h-[32px]">
                    <label for="outputText" class="block text-sm font-medium text-gray-300">Formatted Output</label>
                </div>
                
                <textarea id="outputText" readonly
                    class="flex-grow w-full p-4 bg-gray-950 border border-gray-700 rounded-lg focus:outline-none resize-none font-mono text-sm text-green-400 placeholder-gray-700 shadow-inner" 
                    placeholder="Result will appear here..."
                ></textarea>
                
                <div class="mt-4 relative">
                    <button id="copyBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-lg transition-all duration-200 flex items-center justify-center gap-2 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed border border-blue-500 hover:border-blue-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        Copy to Clipboard
                    </button>
                    <!-- Notification absolute positioned to not disrupt layout -->
                    <div id="notification" class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-green-400 border border-green-500/30 px-3 py-1 rounded shadow-lg text-xs font-medium opacity-0 transition-opacity duration-300 pointer-events-none">
                        Copied successfully!
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-6 pt-6 border-t border-gray-800">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="text-sm font-semibold text-gray-300 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        Custom Rules
                    </h3>
                    <p class="text-xs text-gray-500 mt-1">Rules are applied in order from top to bottom. Use \n for new lines.</p>
                </div>
                <button id="addRuleBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 hover:border-gray-600 text-xs font-medium py-2 px-3 rounded transition-colors flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    Add Rule
                </button>
            </div>
            
            <!-- Rules Container -->
            <div id="rulesContainer" class="space-y-2 max-h-[30vh] overflow-y-auto pr-2">
                <!-- Rules will be injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const addRuleBtn = document.getElementById('addRuleBtn');
            const rulesContainer = document.getElementById('rulesContainer');
            const notification = document.getElementById('notification');

            // Default State
            let rules = [
                { id: generateId(), find: ', ', replace: '\\n', isRegex: false, active: true },
                { id: generateId(), find: '.', replace: ',', isRegex: false, active: true }
            ];

            function generateId() {
                return Math.random().toString(36).substr(2, 9);
            }

            // Parse special characters like \n and \t from literal strings
            function parseSpecialChars(str) {
                return str.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
            }

            // Core formatting engine
            function applyRules() {
                let text = inputText.value;
                if (!text) {
                    outputText.value = '';
                    updateCopyButtonState();
                    return;
                }

                // Clear previous error states on rules
                document.querySelectorAll('.rule-row').forEach(el => el.classList.remove('border-red-900', 'bg-red-950/20'));

                rules.forEach(rule => {
                    if (!rule.active || rule.find === '') return;

                    try {
                        const replacement = parseSpecialChars(rule.replace);
                        
                        if (rule.isRegex) {
                            // Apply as Regular Expression
                            const regex = new RegExp(rule.find, 'g');
                            text = text.replace(regex, replacement);
                        } else {
                            // Apply as Literal String (split/join is safer than string.replace for all occurrences without regex escaping)
                            const findStr = parseSpecialChars(rule.find);
                            text = text.split(findStr).join(replacement);
                        }
                    } catch (e) {
                        console.error('Invalid Regex in rule:', rule, e);
                        // Visually indicate error on the specific rule
                        const ruleEl = document.getElementById(`rule-${rule.id}`);
                        if (ruleEl) {
                            ruleEl.classList.add('border-red-900', 'bg-red-950/20');
                        }
                    }
                });

                outputText.value = text;
                updateCopyButtonState();
            }

            function renderRules() {
                rulesContainer.innerHTML = '';
                
                if (rules.length === 0) {
                    rulesContainer.innerHTML = '<div class="text-center py-4 text-sm text-gray-600 border border-dashed border-gray-800 rounded-lg">No active rules. Output will match input exactly.</div>';
                    return;
                }

                rules.forEach((rule, index) => {
                    const ruleEl = document.createElement('div');
                    ruleEl.id = `rule-${rule.id}`;
                    ruleEl.className = `rule-row flex flex-wrap md:flex-nowrap items-center gap-3 p-3 bg-gray-950/50 border ${rule.active ? 'border-gray-800' : 'border-gray-800/50 opacity-60'} rounded-lg transition-all`;
                    
                    ruleEl.innerHTML = `
                        <!-- Active Toggle -->
                        <div class="flex items-center">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" class="sr-only peer" ${rule.active ? 'checked' : ''} onchange="toggleRule('${rule.id}', this.checked)">
                                <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-gray-300 after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                        
                        <!-- Order Number -->
                        <span class="text-xs font-mono text-gray-600 hidden md:block">#${index + 1}</span>

                        <!-- Find Input -->
                        <div class="flex-grow flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-md px-2 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                            <span class="text-xs text-gray-500 font-medium">Find</span>
                            <input type="text" value="${escapeHtml(rule.find)}" oninput="updateRule('${rule.id}', 'find', this.value)" 
                                class="w-full bg-transparent border-none text-sm text-gray-200 focus:ring-0 py-1.5 font-mono placeholder-gray-600" placeholder="Text or Regex...">
                        </div>

                        <!-- Replace Input -->
                        <div class="flex-grow flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-md px-2 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                            <span class="text-xs text-gray-500 font-medium">Replace</span>
                            <input type="text" value="${escapeHtml(rule.replace)}" oninput="updateRule('${rule.id}', 'replace', this.value)" 
                                class="w-full bg-transparent border-none text-sm text-gray-200 focus:ring-0 py-1.5 font-mono placeholder-gray-600" placeholder="Leave blank to delete...">
                        </div>

                        <!-- Regex Toggle -->
                        <div class="flex items-center gap-1.5 min-w-max">
                            <input type="checkbox" id="regex-${rule.id}" ${rule.isRegex ? 'checked' : ''} onchange="updateRule('${rule.id}', 'isRegex', this.checked)"
                                class="w-4 h-4 text-blue-600 bg-gray-900 border-gray-700 rounded focus:ring-blue-600 focus:ring-2">
                            <label for="regex-${rule.id}" class="text-xs text-gray-400 cursor-pointer" title="Use Regular Expression">Regex</label>
                        </div>

                        <!-- Delete Button -->
                        <button onclick="deleteRule('${rule.id}')" class="text-gray-500 hover:text-red-400 p-1 rounded hover:bg-gray-800 transition-colors" title="Delete Rule">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    `;
                    rulesContainer.appendChild(ruleEl);
                });
            }

            // Expose specific functions to window so inline event handlers in rendered HTML can access them
            window.toggleRule = (id, isActive) => {
                const rule = rules.find(r => r.id === id);
                if (rule) {
                    rule.active = isActive;
                    renderRules(); // Re-render to update visual opacity state
                    applyRules();
                }
            };

            window.updateRule = (id, field, value) => {
                const rule = rules.find(r => r.id === id);
                if (rule) {
                    rule[field] = value;
                    applyRules();
                }
            };

            window.deleteRule = (id) => {
                rules = rules.filter(r => r.id !== id);
                renderRules();
                applyRules();
            };

            function escapeHtml(unsafe) {
                return (unsafe || '').toString()
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            }

            // Event Listeners
            inputText.addEventListener('input', applyRules);

            clearBtn.addEventListener('click', () => {
                inputText.value = '';
                outputText.value = '';
                updateCopyButtonState();
                inputText.focus();
            });

            addRuleBtn.addEventListener('click', () => {
                rules.push({ id: generateId(), find: '', replace: '', isRegex: false, active: true });
                renderRules();
                
                // Focus the newly created input
                setTimeout(() => {
                    const newInputs = rulesContainer.lastElementChild.querySelectorAll('input[type="text"]');
                    if (newInputs.length > 0) newInputs[0].focus();
                }, 50);
            });

            copyBtn.addEventListener('click', () => {
                if (!outputText.value) return;

                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = outputText.value;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                
                try {
                    document.execCommand('copy');
                    showNotification();
                } catch (err) {
                    console.error('Failed to copy text', err);
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(outputText.value).then(showNotification);
                    } else {
                        // Fallback UI instead of alert
                        notification.innerText = "Copy failed manually highlight and copy.";
                        notification.classList.replace('text-green-400', 'text-red-400');
                        notification.classList.replace('border-green-500/30', 'border-red-500/30');
                        notification.classList.remove('opacity-0');
                        setTimeout(() => notification.classList.add('opacity-0'), 3000);
                    }
                } finally {
                    document.body.removeChild(tempTextArea);
                }
            });

            function updateCopyButtonState() {
                if (outputText.value.trim() === '') {
                    copyBtn.disabled = true;
                } else {
                    copyBtn.disabled = false;
                }
            }

            function showNotification() {
                // Reset styling in case of previous errors
                notification.innerText = "Copied successfully!";
                notification.classList.replace('text-red-400', 'text-green-400');
                notification.classList.replace('border-red-500/30', 'border-green-500/30');
                
                notification.classList.remove('opacity-0');
                
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Copied!';
                copyBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                copyBtn.classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
                copyBtn.classList.replace('border-blue-500', 'border-emerald-500');

                setTimeout(() => {
                    notification.classList.add('opacity-0');
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalText;
                        copyBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                        copyBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-blue-500');
                        copyBtn.classList.replace('border-emerald-500', 'border-blue-500');
                    }, 300);
                }, 2000);
            }

            // Initial setup
            renderRules();
            updateCopyButtonState();
        });
    </script>
</body>
</html>
